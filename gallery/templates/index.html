<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Photo & Video Gallery</title>
    <style>
        body {
            font-family: sans-serif;
            margin: 0;
            padding: 20px;
            background-color: #f0f0f0;
        }
        h1 {
            text-align: center;
            color: #333;
        }
        .month-gallery {
            margin-bottom: 40px;
            text-align: center;
        }
        .month-header {
            font-size: 24px;
            color: #333;
            margin-bottom: 15px;
        }
        .month-header a {
            text-decoration: none;
            color: inherit;
        }
        .preview-images-container {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 15px;
            max-width: 900px; /* Constrain the max width */
            margin: 15px auto 0; /* Center the container */
        }
        .preview-image-link {
            display: block;
            /* width is now handled by the grid */
            height: auto;
            aspect-ratio: 4 / 3; /* Maintain a 4:3 aspect ratio */
            border-radius: 8px;
            overflow: hidden;
            box-shadow: 0 4px 8px rgba(0,0,0,0.1);
            transition: transform 0.2s ease-in-out, box-shadow 0.2s ease-in-out;
        }
        .preview-image-link:hover {
            transform: scale(1.05);
            box-shadow: 0 8px 16px rgba(0,0,0,0.2);
        }
        .preview-image {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
    </style>
</head>
<body>
    <h1>My Gallery</h1>
    {% for month in sorted_months %}
        <div class="month-gallery">
            <h2 class="month-header">
                <a href="{{ url_for('month_view', year_month=month) }}">{{ month }} ({{ files_by_month[month]|length }} items)</a>
            </h2>
            {% if month in monthly_previews and monthly_previews[month] %}
                <div class="preview-images-container">
                    {% for image in monthly_previews[month] %}
                        <a href="{{ url_for('month_view', year_month=month) }}" class="preview-image-link">
                            <img src="{{ url_for('media', filename=image.path) }}" alt="Preview for {{ month }}" class="preview-image">
                        </a>
                    {% endfor %}
                </div>
            {% else %}
                <p>No images available for this month.</p>
            {% endif %}
        </div>
    {% endfor %}
</body>
</html>
